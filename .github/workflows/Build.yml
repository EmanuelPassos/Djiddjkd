name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Descompactar o zip
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -1)
          if [ -z "$ZIP" ]; then echo "ERRO: nenhum .zip no repositorio"; exit 1; fi
          echo "Usando: $ZIP"
          mkdir -p proj
          unzip -q -o "$ZIP" -d proj
          find proj -maxdepth 3

      - name: Compilar
        run: |
          G=$(find proj -name build.gradle | head -1)
          if [ -z "$G" ]; then echo "ERRO: build.gradle nao encontrado"; exit 1; fi
          cd "$(dirname "$G")"
          gradle build --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
          rm -f "$GITHUB_WORKSPACE"/out/*-sources.jar "$GITHUB_WORKSPACE"/out/*-dev.jar
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Enviar o jar
        uses: actions/upload-artifact@v4
        with:
          name: EmanuelMegaOptimizer-jar
          path: out/*.jar
          if-no-files-found: error
